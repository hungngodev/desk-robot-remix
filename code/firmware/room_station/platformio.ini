[platformio]
default_envs = feather_nrf52840_room_bench

[env:feather_nrf52840_room_bench]
; REUSE the user's reported owned Feather nRF52840 for ONE shared station.
; This is a source-level bench build, not verified wiring/PCB approval.
platform = nordicnrf52@10.6.0
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200
; Pinned real upstream Arduino sensor drivers. Adafruit OPEN SOURCE code is
; reused; no new Adafruit hardware purchase is being requested.
lib_deps =
  https://github.com/Sensirion/arduino-i2c-scd4x.git#1.1.0
  https://github.com/adafruit/Adafruit_BME680.git#2.0.5
  https://github.com/ncmreynolds/ld2410.git#v0.2.2
  https://github.com/adafruit/Adafruit_AMG88xx.git#1.3.2
build_flags =
  -Wall
  -Wextra
  -DROOM_SOIL_FITTED=0

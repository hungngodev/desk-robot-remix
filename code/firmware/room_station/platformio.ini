[platformio]
default_envs = feather_nrf52840_room_bench

[env]
; Common real Feather carrier and pinned upstream driver source.
platform = nordicnrf52@10.6.0
board = adafruit_feather_nrf52840
framework = arduino
; Exact framework/compiler packages from CI run 45768389395 (2026-11-26).
; Keep in sync with code/toolchain-lock.json for every inherited profile.
platform_packages =
  platformio/framework-arduinoadafruitnrf52 @ 1.10601.0
  platformio/framework-cmsis @ 2.50700.210515
  platformio/toolchain-gccarmnoneeabi @ 1.70201.0
monitor_speed = 115200
lib_deps =
  https://github.com/Sensirion/arduino-i2c-scd4x.git#1.1.0
  https://github.com/adafruit/Adafruit_BME680.git#2.0.5
  https://github.com/ncmreynolds/ld2410.git#v0.2.2
  https://github.com/adafruit/Adafruit_AMG88xx.git#1.3.2
build_flags =
  -Wall
  -Wextra

[env:feather_nrf52840_room_full]
; Same source and exact owned board as BENCH, but includes the already
; implemented A0 median/rail noise capture for the required soil probe.
; Flash only after proving the probe AOUT never exceeds 3.3V at the Feather
; input. A floating A0 cannot authenticate sensor presence or soil moisture.
build_flags = ${env.build_flags} -DROOM_SOIL_FITTED=1 -DROOM_AMG_FITTED=0

[env:feather_nrf52840_room_bench]
; REUSE the user's reported owned Feather nRF52840 for ONE shared station.
; This is a source-level bench build, not verified wiring/PCB approval.
build_flags = ${env.build_flags} -DROOM_SOIL_FITTED=0 -DROOM_AMG_FITTED=0

; Optional thermal acquisition requires an explicit fitted build and consent.
[env:feather_nrf52840_room_bench_thermal]
build_flags = ${env.build_flags} -DROOM_SOIL_FITTED=0 -DROOM_AMG_FITTED=1

[env:feather_nrf52840_room_full_thermal]
build_flags = ${env.build_flags} -DROOM_SOIL_FITTED=1 -DROOM_AMG_FITTED=1

[platformio]
default_envs = bench_nano_dock_01

[env]
platform = atmelavr@5.1.0
board = nanoatmega328
framework = arduino
; Actual upstream NEC sender, not a handwritten IR carrier/protocol stack.
lib_deps = https://github.com/Arduino-IRremote/Arduino-IRremote.git#v4.7.1
build_flags = -Wall -Wextra

[env:bench_nano_dock_01]
build_flags = ${env.build_flags} -DDESK_ROBOT_DOCK_ID=1

[env:bench_nano_dock_02]
build_flags = ${env.build_flags} -DDESK_ROBOT_DOCK_ID=2

[env:bench_nano_dock_03]
build_flags = ${env.build_flags} -DDESK_ROBOT_DOCK_ID=3

[env:bench_nano_dock_04]
build_flags = ${env.build_flags} -DDESK_ROBOT_DOCK_ID=4

[env:bench_nano_dock_05]
build_flags = ${env.build_flags} -DDESK_ROBOT_DOCK_ID=5

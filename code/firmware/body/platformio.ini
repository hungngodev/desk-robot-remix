[platformio]
default_envs = esp32_stepper

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -Wall
  -Wextra
  -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
; Preserved DC/DRV8833 reference, never wire to the stepper pin allocation.
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=0

[env:esp32_stepper]
; Guarded prototype: no default calibration or sensor I/O, so arming is denied.
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=1

[platformio]
default_envs = esp32_stepper

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -Wall
  -Wextra
  -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
; Preserved DC/DRV8833 reference, never wire to the stepper pin allocation.
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=0

[env:esp32_stepper]
; Five VL53L0X through the existing owned 8-channel TCA9548A mux.
; This is the budget-capable high-mount candidate; require real bench height
; and surface qualification. Firmware refuses to arm without local calibration.
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=1
lib_deps =
  pololu/VL53L0X@1.3.1

[platformio]
; Full product must not silently compile the historical five-ranger prototype.
default_envs = esp32_full

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Production builds must never link the standalone bench setup()/loop().
build_src_filter = +<*> -<vl53l0x_bench.cpp>
build_flags =
  -Wall
  -Wextra
  -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
; Preserved DC/DRV8833 reference, never wire to the stepper pin allocation.
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=0

[env:esp32_full]
; Full-feature eight VL53L0X I2C channels. Reuses the same pinned Pololu
; source, TCA9548A, and guarded nonblocking acquisition.
; Three side/rear readings are diagnostics; do not assume turn safety.
lib_deps =
  https://github.com/pololu/vl53l0x-arduino.git#1.3.1
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=1 -DDESK_ROBOT_EXTRA_RANGERS=1 -DDESK_ROBOT_REQUIRE_DOCK_MONITOR=1 -DDESK_ROBOT_ENABLE_TERMINAL_IR=1

[env:esp32_full_haptic_lab]
; OPTIONAL motor-disconnected haptic bringup only. GPB2 on 0x71 lane5
; provides an edge into an independently current-limited hardware one-shot
; and AO3400 low-side driver. Never wire a coin motor directly to MCP23017.
; Production esp32_full remains disabled until one-shot, pull-down and
; electrical/temperature measurements qualify the exact actuator kit.
extends = env:esp32_full
build_flags = ${env:esp32_full.build_flags} -DDESK_ROBOT_ENABLE_HAPTIC=1

[env:esp32_dc_full]
; A genuine FULL-SENSOR protected motor path using DRV8833 DC motor pins.
; This preserves all five cliff/front, three side/rear, dual IR, two muxes,
; sensor interaction and MCP23017 dock lockouts in the source image.
; It is NOT a qualified production drivetrain: motor torque, stall current,
; loaded stop and mechanical geometry still need physical acceptance.
lib_deps =
  https://github.com/pololu/vl53l0x-arduino.git#1.3.1
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=0 -DDESK_ROBOT_FULL_SENSORS=1 -DDESK_ROBOT_EXTRA_RANGERS=1 -DDESK_ROBOT_REQUIRE_DOCK_MONITOR=1 -DDESK_ROBOT_ENABLE_TERMINAL_IR=1

[env:esp32_dc_watchdog_lab]
; OFF BY DEFAULT. Software gated heartbeat on DC-only GPIO23 into the
; unused channel of the SAME generic dual CD74HC123 used for haptics.
; Hardware one-shot Q must disable DRV8833 nSLEEP after a stopped CPU.
; Unqualified electrical schematic and pulse tolerance. Disconnect motors
; and charger for initial logic-only bringup. Cannot combine with STEP pins.
extends = env:esp32_dc_full
build_flags = ${env:esp32_dc_full.build_flags} -DDESK_ROBOT_ENABLE_DC_WATCHDOG=1

[env:esp32_dc_integrated_lab]
; End-to-end compile of eight guarded VL53L0X, 0x71 accessories, dual
; NEC docking receiver, N20+DRV8833 source alternative, BOTH channels
; of one external CD74HC123 (haptic Q1 and hardware motor-cutoff Q2).
; No new MCU or Adafruit hardware required. This is a motor-disconnected
; electrical LAB profile until exact nSLEEP and haptic hardware qualify.
extends = env:esp32_dc_full
build_flags = ${env:esp32_dc_full.build_flags} -DDESK_ROBOT_ENABLE_HAPTIC=1 -DDESK_ROBOT_ENABLE_DC_WATCHDOG=1

[env:esp32_stepper]
; Real 5x VL53L0X acquisition on TCA9548A. Owner measured calibration
; is still required and motion remains disabled without fresh valid samples.
; Pololu VL53L0X MIT source handles startup; critical reads use bounded I2C.
; Cheap GY-530 is a candidate, not a qualified exact carrier.
lib_deps =
  https://github.com/pololu/vl53l0x-arduino.git#1.3.1
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=1

[env:esp32_vl53l0x_bench]
; Standalone 1x cheap generic VL53L0X on TCA9548A 0x70 CH0.
; No motors, no CliffGuard permission, not the production firmware.
; Physically disconnect actuator power before flashing.
build_src_filter = -<*> +<vl53l0x_bench.cpp>
lib_deps =
  https://github.com/pololu/vl53l0x-arduino.git#1.3.1
build_flags = ${env.build_flags}

[platformio]
default_envs = esp32_stepper

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -Wall
  -Wextra
  -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
; Preserved DC/DRV8833 reference, never wire to the stepper pin allocation.
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=0

[env:esp32_stepper]
; Real 5x VL53L4CD acquisition on TCA9548A. Owner measured calibration
; is still required and motion remains disabled without fresh valid samples.
; Pololu source is a compact BSD 3-Clause Clear remix of ST's official ULD.
; Its generic read() is deliberately NOT used by the critical acquisition loop.
lib_deps =
  https://github.com/pololu/vl53l4cd-arduino.git#bc865905fc97085f40ca9edab478210c01195fde
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=1

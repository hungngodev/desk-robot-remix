[platformio]
; Full product must not silently compile the historical five-ranger prototype.
default_envs = esp32_full

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Production builds must never link the standalone bench setup()/loop().
build_src_filter = +<*> -<vl53l0x_bench.cpp> -<servo_center_bench.cpp>
build_flags =
  -Wall
  -Wextra
  -DCORE_DEBUG_LEVEL=0

[env:esp32_servo_center_bench]
; Calibration tool ONLY. Motor driver harness physically disconnected and
; BOTH servo horns removed. USB0 operator may center one servo at a time
; for at most 400 ms; no drive, force, charger, network or physical release.
build_src_filter = -<*> +<servo_center_bench.cpp>
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=0 -DDESK_ROBOT_FULL_SENSORS=0

[env:esp32dev]
; Historical DC/DRV8833 reference only. Flashable for diagnostics, but
; intentionally actuator-inert: NO wheel or servo output or accepted ARM.
; Use a fully guarded, independently qualified profile for physical motion.
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=0 -DDESK_ROBOT_FULL_SENSORS=0

[env:esp32_full]
; Full-feature eight VL53L0X I2C channels. Reuses the same pinned Pololu
; source, TCA9548A, and guarded nonblocking acquisition.
; DEFAULT MOTOR POWER IS DISABLED: the owned 28BYJ48/ULN2003 lacks an
; independently timed motor-rail cutoff on hardware. No coil energization
; or successful arm until a separate fail-low cutoff is physically qualified.
; Three side/rear readings are diagnostics; do not assume turn safety.
lib_deps =
  https://github.com/pololu/vl53l0x-arduino.git#9f3773cb48d4e4e844d689cfc529a06f96d1d264
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=1 -DDESK_ROBOT_STEPPER_HARDWARE_CUTOFF_QUALIFIED=0 -DDESK_ROBOT_EXTRA_RANGERS=1 -DDESK_ROBOT_REQUIRE_DOCK_MONITOR=1 -DDESK_ROBOT_REQUIRE_FUEL_MONITOR=1 -DDESK_ROBOT_ENABLE_BUMPER=1 -DDESK_ROBOT_ENABLE_TERMINAL_IR=1 -DDESK_ROBOT_ENABLE_REED=1

[env:esp32_full_pulse_reversed_lab]
; Generic MAX30102 carriers may expose inverted red/IR FIFO ordering.
; LAB ONLY: default full build retains datasheet RED first. Run an actual
; LED isolation trial on the exact PCB before choosing this mapping.
; Inherits motor-power-disabled full robot and all eight protected ToF lanes.
extends = env:esp32_full
build_flags = ${env:esp32_full.build_flags} -DDESK_ROBOT_MAX30102_FIFO_IR_FIRST=1

[env:esp32_full_interaction_lab]
; Bench only: exercise optional GPIOB1 PIR using the existing pipeline.
; Both full builds already require GPIO35 normally closed bumper hardware
; with an external 3.3V pullup and two normally closed contacts in series.
; A floating or unpowered pullup cannot establish real switch continuity.
; Known idle PIR logic MUST be measured before using this lab accessory.
extends = env:esp32_full
build_flags = ${env:esp32_full.build_flags} -DDESK_ROBOT_ENABLE_PIR=1

[env:esp32_full_haptic_lab]
; OPTIONAL motor-disconnected haptic bringup only. GPB2 on 0x71 lane5
; provides an edge into an independently current-limited hardware one-shot
; and AO3400 low-side driver. Never wire a coin motor directly to MCP23017.
; Production esp32_full remains disabled until one-shot, pull-down and
; electrical/temperature measurements qualify the exact actuator kit.
extends = env:esp32_full
build_flags = ${env:esp32_full.build_flags} -DDESK_ROBOT_ENABLE_HAPTIC=1

[env:esp32_dc_full]
; A genuine FULL-SENSOR protected motor path using DRV8833 DC motor pins.
; This preserves all five cliff/front, three side/rear, dual IR, two muxes,
; sensor interaction and MCP23017 dock lockouts in the source image.
; Full DC profiles emit the CPU-gated heartbeat on GPIO23.
; External CD74HC123 Q2 wired to DRV8833 nSLEEP is still REQUIRED.
; This is NOT proof of physical cutoff or a qualified drivetrain.
; It is NOT a qualified production drivetrain: motor torque, stall current,
; loaded stop and mechanical geometry still need physical acceptance.
lib_deps =
  https://github.com/pololu/vl53l0x-arduino.git#9f3773cb48d4e4e844d689cfc529a06f96d1d264
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=0 -DDESK_ROBOT_FULL_SENSORS=1 -DDESK_ROBOT_EXTRA_RANGERS=1 -DDESK_ROBOT_REQUIRE_DOCK_MONITOR=1 -DDESK_ROBOT_REQUIRE_FUEL_MONITOR=1 -DDESK_ROBOT_ENABLE_BUMPER=1 -DDESK_ROBOT_ENABLE_TERMINAL_IR=1 -DDESK_ROBOT_ENABLE_REED=1 -DDESK_ROBOT_ENABLE_DC_WATCHDOG=1 -DDESK_ROBOT_REQUIRE_DC_NFAULT=1 -DDESK_ROBOT_DC_HARDWARE_CUTOFF_QUALIFIED=0

[env:esp32_dc_watchdog_lab]
; OFF BY DEFAULT. Software gated heartbeat on DC-only GPIO23 into the
; unused channel of the SAME generic dual CD74HC123 used for haptics.
; Hardware one-shot Q must disable DRV8833 nSLEEP after a stopped CPU.
; Unqualified electrical schematic and pulse tolerance. Disconnect motors
; and charger for initial logic-only bringup. Cannot combine with STEP pins.
extends = env:esp32_dc_full
build_flags = ${env:esp32_dc_full.build_flags} -DDESK_ROBOT_ENABLE_DC_WATCHDOG=1

[env:esp32_dc_integrated_lab]
; End-to-end compile of eight guarded VL53L0X, 0x71 accessories, dual
; NEC docking receiver, N20+DRV8833 source alternative, BOTH channels
; of one external CD74HC123 (haptic Q1 and hardware motor-cutoff Q2).
; No new MCU or Adafruit hardware required. This is a motor-disconnected
; electrical LAB profile until exact nSLEEP and haptic hardware qualify.
extends = env:esp32_dc_full
build_flags = ${env:esp32_dc_full.build_flags} -DDESK_ROBOT_ENABLE_HAPTIC=1 -DDESK_ROBOT_ENABLE_DC_WATCHDOG=1 -DDESK_ROBOT_PACK_SHUNT_MOHM=5

[env:esp32_stepper]
; Real 5x VL53L0X acquisition on TCA9548A. Owner measured calibration
; is still required and motion remains disabled without fresh valid samples.
; Pololu VL53L0X MIT source handles startup; critical reads use bounded I2C.
; Cheap GY-530 is a candidate, not a qualified exact carrier.
lib_deps =
  https://github.com/pololu/vl53l0x-arduino.git#9f3773cb48d4e4e844d689cfc529a06f96d1d264
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=1

[env:esp32_vl53l0x_bench]
; Standalone 1x cheap generic VL53L0X on TCA9548A 0x70 CH0.
; No motors, no CliffGuard permission, not the production firmware.
; Physically disconnect actuator power before flashing.
build_src_filter = -<*> +<vl53l0x_bench.cpp>
lib_deps =
  https://github.com/pololu/vl53l0x-arduino.git#9f3773cb48d4e4e844d689cfc529a06f96d1d264
; Select the complete actuator pin superset for LOW-only bench initialization.
; The source filter still excludes main.cpp and all motion authority.
build_flags = ${env.build_flags} -DDESK_ROBOT_STEPPER=1

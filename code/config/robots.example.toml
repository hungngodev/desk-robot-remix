# Copy to local.toml and enter the actual heads' LAN addresses/device IDs after assembly.
# Head tokens must match the selected head's private build settings. Never put tokens here.
# Before real diagnostics or ARM, set EACH robot's motor_backend only after
# independently verifying its actual installed motor driver, wiring and flashed
# WROOM firmware. Supported: stepper_28byj48 (28BYJ48/ULN2003) or
# dc_pwm_guarded (N20/DRV8833). Unconfigured or mismatched means no ARM.
mode = "hardware"
ollama_model = "qwen3:8b"
# Install and test an actual local image-capable model before enabling.
# Example only, model name must exist in your own Ollama installation.
vision_model = ""
# Explicit privacy opt-in for spoken visual questions and VAD camera sampling.
voice_vision_tools_enabled = false
# Install a LOCAL multimodal model in Ollama, then select its actual name.
# Set this only after running ollama pull MODEL and evaluating real scene accuracy.
memory_dir = "../data/private/pet-memory"
trials_file = "../data/physical-trials.jsonl"
vision_weights = "../models/yolov8s-worldv2.pt"

[[robots]]
id = "robot-01"
name = "Pip"
head_url = "http://192.168.1.101:8081"
token_env = "DESK_ROBOT_HEAD_01_TOKEN"
device_id = ""
motion_enabled = false
# After verifying this physical unit, uncomment the exact fitted profile:
# motor_backend = "dc_pwm_guarded"
calibration = "calibration.example.json"
voice = "af_heart"
persona = "You are Pip, a curious desk robot. Speak one short sentence. Take turns with your peer."


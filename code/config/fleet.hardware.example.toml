# ONE FULL FIVE PET FLEET, never a reduced demo. Copy to local.toml.
# Replace LAN addresses, private env tokens and real Xiaozhi device_id for each.
# Hardware motors and dock must remain disabled until real physical calibration.
mode = "hardware"
ollama_url = "http://127.0.0.1:11434"
ollama_model = "qwen3:8b"
kokoro_url = "http://127.0.0.1:8880"
speech_bridge_url = "http://127.0.0.1:8766"
vision_model = ""
voice_vision_tools_enabled = false
# Explicit opt in only after a local VLM, real Xiaozhi VAD, and camera consent.
# Autonomous observation on boot is not motor or charger authorization.
pet_autostart_enabled = false
voice_memory_tools_enabled = false
# Additional explicit consent for retaining completed native ASR text in each
# robot's private SQLite memory. Never stores PCM/JPEG or implies speaker ID.
# Requires voice_memory_tools_enabled=true and a model that emits ASR events.
voice_transcript_memory_enabled = false
# One shared room station over the existing owned Feather nRF52840 USB.
# Never a new motor controller, never copies one pet memory to another.
# Needs installed pyserial: pip install '.[room]' inside code.
room_station_enabled = false
room_station_context_enabled = false
# Set to the actual inspected Mac /dev/cu.usbmodem* path when connected.
# room_station_port = "/dev/cu.usbmodemVERIFIED"
# Only AFTER connecting one electrically verified 3.3V analog capacitive
# soil probe to the owned Feather A0 / D14 / nRF P0.04, enable the probe
# in the explicit ROOM_SOIL_FITTED=1 firmware build and measure TWO actual
# raw 12-bit references with this same probe in genuinely dry and wet media.
# Both fields must be specified together, must be 1..4094 and differ by >=100.
# No synthetic dry/wet numbers are supplied: do not copy sample thresholds.
# room_station_soil_dry_adc = MEASURED_DRY_INTEGER
# room_station_soil_wet_adc = MEASURED_WET_INTEGER
fleet_text_sharing_enabled = false
# Opt-in, measured five-pet interaction. Requires fleet_text_sharing_enabled=true.
# Only two enabled, unmuted pets talk for two short turns about a witnessed
# camera/gesture/toy event using the existing exclusive Xiaozhi speech owner.
fleet_social_autonomy_enabled = false
fleet_social_min_interval_seconds = 300
memory_dir = "../data/private/memory"
trials_file = "../data/physical-trials.jsonl"

[[robots]]
id = "robot-01"
# Must match the flashed dock beacon NEC command (0x30 + ID).
# This is ONLY identity filtering; physical charging remains disabled.
dock_beacon_id = 1
name = "Pip"
head_url = "http://192.168.1.101:8081" # REPLACE with verified actual head address
token_env = "DESK_ROBOT_HEAD_01_TOKEN"
device_id = "" # REPLACE with real unique Xiaozhi device identity
voice = "af_heart"
persona = "I am Pip, a curious and playful full desk pet. Observe my own real camera and sensors, remember real interactions and speak naturally without interrupting a human."
motion_enabled = false
exploration_qualified = false
dock_motion_qualified = false
gesture_interactions_qualified = false
battery_low_percent = 20
# Measure raw IR against the actual paw shell before enabling optical contact.
# Never infer a human pulse or medical measurement from this value.
paw_contact_interactions_qualified = false
ambient_interactions_qualified = false
bmp280_interactions_qualified = false  # a measured pressure threshold is required
# bmp280_pressure_change_pa = 300  # EXAMPLE, physical housing study required
nfc_interactions_qualified = false  # toy tag IDs are not authentication or permissions
# ambient_temp_change_centi = 300  # EXAMPLE ONLY; actual SHT41 thermal drift must be measured
# ambient_humidity_change_centi = 1000  # EXAMPLE ONLY
# paw_contact_ir_raw_threshold = 12000  # EXAMPLE ONLY, not a calibration


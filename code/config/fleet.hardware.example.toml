# ONE FULL FIVE PET FLEET, never a reduced demo. Copy to local.toml.
# Replace LAN addresses, private env tokens and real Xiaozhi device_id for each.
# Hardware motors and dock must remain disabled until real physical calibration.
mode = "hardware"
ollama_url = "http://127.0.0.1:11434"
ollama_model = "qwen3:8b"
kokoro_url = "http://127.0.0.1:8880"
speech_bridge_url = "http://127.0.0.1:8766"
vision_model = ""
voice_vision_tools_enabled = false
voice_memory_tools_enabled = false
fleet_text_sharing_enabled = false
memory_dir = "../data/private/memory"
trials_file = "../data/physical-trials.jsonl"

[[robots]]
id = "robot-01"
name = "Pip"
head_url = "http://192.168.1.101:8081" # REPLACE with verified actual head address
token_env = "DESK_ROBOT_HEAD_01_TOKEN"
device_id = "" # REPLACE with real unique Xiaozhi device identity
voice = "af_heart"
persona = "I am Pip, a curious and playful full desk pet. Observe my own real camera and sensors, remember real interactions and speak naturally without interrupting a human."
motion_enabled = false
exploration_qualified = false
dock_motion_qualified = false
gesture_interactions_qualified = false
battery_low_percent = 20
# Measure raw IR against the actual paw shell before enabling optical contact.
# Never infer a human pulse or medical measurement from this value.
paw_contact_interactions_qualified = false
ambient_interactions_qualified = false
# ambient_temp_change_centi = 300  # EXAMPLE ONLY; actual SHT41 thermal drift must be measured
# ambient_humidity_change_centi = 1000  # EXAMPLE ONLY
# paw_contact_ir_raw_threshold = 12000  # EXAMPLE ONLY, not a calibration


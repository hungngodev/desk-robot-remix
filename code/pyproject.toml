[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "desk-robot-remix"
version = "0.1.0"
description = "Supervised local coordinator for the SMARS/Xiaozhi robot remix"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "numpy>=1.26,<3", "Pillow>=10,<13", "PyYAML>=6,<7", "pydantic>=2.10,<3"]

[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9", "opencv-python>=4.10,<5"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "aiohttp>=3.12,<4", "pyserial>=3.5,<4"]
room = ["pyserial>=3.5,<4"]

[project.scripts]
desk-robot = "desk_robot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["laptop/src/desk_robot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "firmware/head/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# C++ patch/test string templates and untouched legacy test files with long contract assertions.
"firmware/head/install_overlay.py" = ["E501"]
"laptop/server/install_overlay.py" = ["E501"]
"firmware/head/tests/*.py" = ["E501"]

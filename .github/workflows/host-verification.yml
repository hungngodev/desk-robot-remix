name: Host verification

on:
  pull_request:
  push:
    branches:
      - codex/initial-remix
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Per-job lanes keep one active and one newest pending automatic PR revision.
# An explicit rerun uses its run ID as a separate lane group so it can finish
# even while other workers push, without queueing every intermediate commit.
# Never combine the lanes into one workflow-level concurrency group.
# Host Python 3.11 is both the supported minimum and the CI reference minor
# (latest available patch); keep it aligned with code/toolchain-lock.json and
# pyproject.toml. Firmware SDK bootstrap environments are separate.
jobs:
  mac-fast:
    name: Mac conversation and memory regression
    concurrency:
      group: host-verification-mac-fast-${{ github.run_attempt > 1 && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit under test
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git -c safe.directory="$PWD" rev-parse HEAD)"
          test "$actual" = "$expected"
      - &repository_integrity
        name: Prevent partial repository trees
        shell: bash
        run: |
          set -euo pipefail
          # Include hidden root entries: a truncated Git Database tree may
          # retain a few visible source files but drop shared agent assets,
          # workflow configuration, or repository license metadata.
          for directory in .agent3d .github agents code docs; do
            if [ ! -d "$directory" ] || [ -L "$directory" ]; then
              echo "::error::Missing expected repository root directory: $directory"
              exit 1
            fi
          done
          for file in .gitignore AGENTS.md LICENSE README.md THIRD_PARTY_NOTICES.md; do
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              echo "::error::Missing expected repository root file: $file"
              exit 1
            fi
          done
          test -f code/firmware/body/include/BodyPins.h
          test -f code/firmware/head/sense/config.h
          test -f docs/hardware/full-feature-plan.json
          test -f docs/records/verification.md
          test -f code/laptop/src/desk_robot/handling.py
          # November 25 baseline: 971 tracked blobs. Count NUL delimiters,
          # not rendered paths. Conservative per-owner floors catch partial
          # commits even if the overall tree and root sentinels survive.
          check_tree_count() {
            local scope="$1" minimum="$2" count
            count=$(git -c safe.directory="$PWD" ls-files -z -- "$scope" | tr -cd '\000' | wc -c | tr -d '[:space:]')
            if [ "$count" -lt "$minimum" ]; then
              echo "::error::Partial repository tree: $scope has only $count tracked files (minimum $minimum)"
              exit 1
            fi
          }
          check_tree_count code/laptop/src 50
          check_tree_count code/laptop/server 6
          check_tree_count code/tests 200
          check_tree_count code/scripts 30
          check_tree_count code/firmware/head 60
          check_tree_count code/firmware/body 75
          check_tree_count code/firmware/room_station 18
          check_tree_count code/firmware/dock 2
          check_tree_count code 470
          check_tree_count docs 200
          check_tree_count agents 230
          check_tree_count . 900
          # git ls-files counts sparse-checkout entries even when an entire
          # non-sentinel subtree is absent from the actual worktree. A green
          # source test requires every tracked path to exist on disk.
          while IFS= read -r -d '' tracked_path; do
            if [ ! -e "$tracked_path" ] && [ ! -L "$tracked_path" ]; then
              echo "::error::Missing tracked worktree path: $tracked_path"
              exit 1
            fi
          done < <(git -c safe.directory="$PWD" ls-files -z)
      - uses: astral-sh/setup-uv@v6
      - name: Verify imports with locked runtime dependencies only
        working-directory: code
        run: |
          uv python install 3.11
          uv sync --no-dev --no-editable --python 3.11 --locked
          .venv/bin/python -I - <<'PY'
          import importlib
          import pkgutil
          from pathlib import Path

          import desk_robot

          root = Path("laptop/src/desk_robot")
          assert (root / "__init__.py").is_file(), "Missing source package"
          expected = set()
          for path in root.rglob("*.py"):
              parts = path.relative_to(root).with_suffix("").parts
              if parts[-1] == "__init__":
                  parts = parts[:-1]
              expected.add(".".join(("desk_robot", *parts)))
          modules = {desk_robot.__name__}
          modules.update(item.name for item in pkgutil.walk_packages(
              desk_robot.__path__, desk_robot.__name__ + "."
          ))
          assert modules == expected, (
              f"Runtime wheel module mismatch: missing={sorted(expected - modules)}, "
              f"extra={sorted(modules - expected)}"
          )
          for module in sorted(modules):
              importlib.import_module(module)
          print(f"Imported {len(modules)} runtime modules without extras")
          PY
      - name: Install locked Mac test dependencies
        working-directory: code
        run: |
          uv python install 3.11
          uv sync --extra dev --python 3.11 --locked
      - name: Restore pinned Xiaozhi server fixture
        working-directory: code
        run: |
          mkdir -p upstream
          mkdir upstream/xiaozhi-esp32-server
          git init upstream/xiaozhi-esp32-server
          git -C upstream/xiaozhi-esp32-server remote add origin https://github.com/xinnan-tech/xiaozhi-esp32-server.git
          git -C upstream/xiaozhi-esp32-server fetch --depth=1 origin d9c2e8c5d92627b670dec57d72a07a4226a410a3
          git -C upstream/xiaozhi-esp32-server checkout --detach FETCH_HEAD
          test "$(git -C upstream/xiaozhi-esp32-server rev-parse HEAD)" = "d9c2e8c5d92627b670dec57d72a07a4226a410a3"
      - name: Verify bounded Mac voice, memory and fleet ownership
        working-directory: code
        run: |
          uv run --no-sync pytest -q -ra \
            tests/test_attention.py \
            tests/test_handling_drive_boundary.py \
            tests/test_side_ranging.py \
            tests/test_live_turns.py \
            tests/test_runtime_voice_priority.py \
            tests/test_brain_context.py \
            tests/test_brain_core_memory.py \
            tests/test_core_memory_mutation_race.py \
            tests/test_brain_memory_retrieval.py \
            tests/test_memory_*.py \
            tests/test_conversation_*.py \
            tests/test_episode_memory_mutation_race.py \
            tests/test_native_startup_memory_fence.py \
            tests/test_native_omni_consent_grant.py \
            tests/test_native_spoken_grant.py \
            tests/test_native_transcript_consent_grant.py \
            tests/test_tool_receipt_bridge_signature.py \
            tests/test_tool_receipt_operator_scope.py \
            tests/test_api_conversation.py \
            tests/test_api_readonly_context_split.py \
            tests/test_api_motion_lifecycle.py \
            tests/test_realtime_omni_protocol.py \
            tests/test_native_omni_xiaozhi.py \
            tests/test_voice_memory_reuse.py \
            tests/test_battery_voice_voltage_integrity.py \
            tests/test_pet.py \
            tests/test_grasp_feedback.py \
            tests/test_control.py::test_hardware_fleet_allows_only_one_moving_pet_until_acknowledged_stop \
            tests/test_control.py::test_fleet_motion_owner_latches_failed_stop_until_explicit_recovery \
            tests/test_stop_transport_failure.py::StopTransportFailureTests::test_cooperative_job_cancellation_preserves_failed_physical_stop \
            tests/test_stop_transport_failure.py::StopTransportFailureTests::test_terminal_stop_halts_body_but_short_pulse_preserves_arm \
            tests/test_stop_transport_failure.py::StopTransportFailureTests::test_urgent_halt_bypasses_stalled_status_request \
            tests/test_stop_transport_failure.py::StopTransportFailureTests::test_uart_status_disconnect_fences_queued_control_until_halt \
            tests/test_vision_worker.py::test_scene_comparator_unhashable_model_kind_is_rejected_without_crash \
            tests/test_multimodal.py::test_unhashable_multimodal_cues_are_rejected_without_mutation \
            tests/test_multimodal_api.py::test_mac_semantic_planner_rejects_late_plan_after_new_human_vad \
            tests/test_server_bridge.py::test_legacy_brain_blends_live_mac_evidence_per_pet_without_history_bloat \
            tests/test_server_bridge.py::test_legacy_brain_clears_old_context_when_mac_revokes_permission \
            tests/test_server_bridge.py::test_legacy_brain_drops_old_mac_reply_after_new_voice_turn \
            tests/test_server_bridge.py::test_legacy_mac_context_remains_tool_data_never_system_or_human \
            tests/test_server_bridge.py::test_legacy_mac_context_rejects_older_overlapping_tool_result \
            tests/test_server_bridge.py::test_legacy_mac_context_expires_without_persisting_to_session_memory \
            tests/test_server_bridge.py::test_native_kokoro_voice_is_bound_to_current_pets_without_config_bleed \
            tests/test_server_bridge.py::test_native_voice_refuses_missing_or_malformed_operator_mapping \
            tests/test_server_bridge.py::test_native_kokoro_voice_fails_closed_for_unmapped_provider \
            tests/test_server_bridge.py::test_native_voice_mapping_export_matches_fleet_and_rejects_duplicates \
            tests/test_server_bridge.py::test_pinned_upstream_connection_initializes_per_device_native_tts \
            tests/test_server_bridge.py::test_actual_pinned_xiaozhi_tts_initializer_selects_each_registered_voice \
            tests/test_ci_python_imports.py \
            tests/test_ci_upstream_fixture.py \
            tests/test_ci_collection_scope.py \
            tests/test_ci_python_dependencies.py \
            tests/test_ci_lane_concurrency.py

  python-and-head-host:
    concurrency:
      group: host-verification-python-and-head-host-${{ github.run_attempt > 1 && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    name: Python and head host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR CI must verify the reviewed branch source, not GitHub's
          # synthetic merge SHA. For push/manual jobs use the event SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit under test
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git -c safe.directory="$PWD" rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::Wrong checkout: expected $expected, got $actual"
            exit 1
          }
      - *repository_integrity
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Compile head test Python before expensive toolchain setup
        working-directory: code
        run: python3 -m compileall -q laptop/src laptop/server/overlay laptop/server/*.py tests scripts firmware/head/*.py firmware/head/tests
      - name: Install Python and locked dependencies
        working-directory: code
        run: |
          uv python install 3.11
          uv sync --extra dev --python 3.11 --locked
      - name: Python lint
        working-directory: code
        run: uv run --no-sync ruff check laptop/src laptop/server/overlay laptop/server/*.py tests scripts firmware/head/*.py firmware/head/tests

      - name: Install pinned headless OpenCV for dock geometry tests
        working-directory: code
        shell: bash
        run: |
          set -euo pipefail
          versions=$(mktemp -d)
          trap 'rm -rf "$versions"' EXIT
          uv pip freeze --python .venv/bin/python | sort > "$versions/expected"
          uv pip install --python .venv/bin/python --no-deps --only-binary :all: --require-hashes -r requirements-ci-opencv.txt
          uv pip check --python .venv/bin/python
          printf '%s\n' 'opencv-python-headless==4.13.0.92' >> "$versions/expected"
          sort -o "$versions/expected" "$versions/expected"
          uv pip freeze --python .venv/bin/python | sort > "$versions/actual"
          diff -u "$versions/expected" "$versions/actual"
      - name: Enforce one generated fleet purchase ledger
        working-directory: code
        run: |
          uv run --no-sync python scripts/procurement_release.py --format csv | diff -u ../docs/hardware/fleet-components.csv -
          uv run --no-sync python scripts/procurement_release.py --format markdown | diff -u ../docs/hardware/complete-shopping-checklist.md -

      - name: Test real OpenCV calibration and dock perception
        working-directory: code
        run: uv run --no-sync pytest -q tests/test_calibrate_dock_camera.py tests/test_dock_vision.py
      - name: Restore pinned Xiaozhi server fixture
        working-directory: code
        run: |
          mkdir -p upstream
          mkdir upstream/xiaozhi-esp32-server
          git init upstream/xiaozhi-esp32-server
          git -C upstream/xiaozhi-esp32-server remote add origin https://github.com/xinnan-tech/xiaozhi-esp32-server.git
          git -C upstream/xiaozhi-esp32-server fetch --depth=1 origin d9c2e8c5d92627b670dec57d72a07a4226a410a3
          git -C upstream/xiaozhi-esp32-server checkout --detach FETCH_HEAD
          test "$(git -C upstream/xiaozhi-esp32-server rev-parse HEAD)" = "d9c2e8c5d92627b670dec57d72a07a4226a410a3"
      - name: Restore pinned Xiaozhi device firmware fixture
        working-directory: code
        run: |
          mkdir -p upstream
          mkdir upstream/xiaozhi-esp32
          git init upstream/xiaozhi-esp32
          git -C upstream/xiaozhi-esp32 remote add origin https://github.com/78/xiaozhi-esp32.git
          git -C upstream/xiaozhi-esp32 fetch --depth=1 origin c435f99a88066029ec2dbd2d758c8cc9d051565b
          git -C upstream/xiaozhi-esp32 checkout --detach FETCH_HEAD
          test "$(git -C upstream/xiaozhi-esp32 rev-parse HEAD)" = "c435f99a88066029ec2dbd2d758c8cc9d051565b"
      - name: Install OpenSCAD and cJSON host test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openscad libcjson-dev pkg-config
      - name: Host tests
        working-directory: code
        run: uv run --no-sync pytest -q -ra tests firmware/head/tests
      - name: Verify any promoted playbook evidence against GitHub
        working-directory: code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync python scripts/verify_playbook_receipts.py

  body-platformio:
    concurrency:
      group: host-verification-body-platformio-${{ github.run_attempt > 1 && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    name: ESP32 WROOM firmware compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR CI must verify the reviewed branch source, not GitHub's
          # synthetic merge SHA. For push/manual jobs use the event SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit under test
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git -c safe.directory="$PWD" rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::Wrong checkout: expected $expected, got $actual"
            exit 1
          }
      - *repository_integrity
      - uses: astral-sh/setup-uv@v6
      - name: Compile guarded stepper firmware
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/body -e esp32_stepper
      - name: Compile full eight low-cost VL53L0X robot firmware
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/body -e esp32_full
      - name: Compile generic MAX30102 reversed FIFO lab (motor power disabled)
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/body -e esp32_full_pulse_reversed_lab
      - name: Compile optional bumper and PIR interaction lab
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/body -e esp32_full_interaction_lab
      - name: Compile opt-in haptic MCP23017 lab firmware
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/body -e esp32_full_haptic_lab
      - name: Compile full guarded DRV8833 DC drivetrain firmware
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/body -e esp32_dc_full
      - name: Compile DC only GPIO23 external watchdog lab firmware
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/body -e esp32_dc_watchdog_lab
      - name: Compile entire guarded DC plus haptic plus independent watchdog together
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/body -e esp32_dc_integrated_lab
      - name: Compile isolated low-cost VL53L0X sample bench without motors
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/body -e esp32_vl53l0x_bench
      - name: Compile one shared Feather room station with pinned upstream drivers
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/room_station -e feather_nrf52840_room_bench
      - name: Compile full Feather room station including soil analog ADC
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/room_station -e feather_nrf52840_room_full
      - name: Compile Feather room station bench profile with thermal enabled
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/room_station -e feather_nrf52840_room_bench_thermal
      - name: Compile full Feather room station with thermal enabled
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/room_station -e feather_nrf52840_room_full_thermal
      - name: Verify resolved room station library inventory
        run: python3 code/scripts/verify_room_station_dependencies.py feather_nrf52840_room_bench feather_nrf52840_room_full feather_nrf52840_room_bench_thermal feather_nrf52840_room_full_thermal
      - name: Compile hornless one-shot WROOM MG90S centering fixture
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/body -e esp32_servo_center_bench
      - name: Compile preserved DC reference
        run: uvx --from platformio==6.1.18 pio run -d code/firmware/body -e esp32dev
      - name: Compile five source-reused classic NEC bench dock beacons
        run: |
          for id in 01 02 03 04 05; do
            uvx --from platformio==6.1.18 pio run -d code/firmware/dock -e "bench_nano_dock_$id"
          done

  body-host:
    concurrency:
      group: host-verification-body-host-${{ github.run_attempt > 1 && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    name: Body C++ host tests with sanitizers
    runs-on: ubuntu-latest
    env:
      # UBSan otherwise reports recoverable errors but exits successfully.
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          # PR CI must verify the reviewed branch source, not GitHub's
          # synthetic merge SHA. For push/manual jobs use the event SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit under test
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git -c safe.directory="$PWD" rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::Wrong checkout: expected $expected, got $actual"
            exit 1
          }
      - *repository_integrity
      - name: Verify UBSan failures cannot pass CI
        shell: bash
        run: |
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          cat > "$probe/overflow.cpp" <<'CPP'
          #include <climits>
          int main() {
            volatile int maximum = INT_MAX;
            volatile int result = maximum + 1;
            (void)result;
            return 0;
          }
          CPP
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined \
            "$probe/overflow.cpp" -o "$probe/overflow"
          if "$probe/overflow" > "$probe/output" 2>&1; then
            echo "::error::UBSan reported undefined behavior without failing"
            exit 1
          fi
          grep -F 'runtime error: signed integer overflow' "$probe/output"
      - name: Configure portable C++ tests
        run: cmake -S code/firmware/body -B /tmp/desk-robot-body-host -DBODY_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build /tmp/desk-robot-body-host --parallel 2
      - name: Run tests
        run: ctest --test-dir /tmp/desk-robot-body-host --output-on-failure --no-tests=error
      - name: Verify every room station C++ test with sanitizers
        run: python3 code/scripts/verify_room_station_host.py

  sense-idf:
    concurrency:
      group: host-verification-sense-idf-${{ github.run_attempt > 1 && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    name: XIAO Sense ESP-IDF 6.1 firmware compile
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
        with:
          # PR CI must verify the reviewed branch source, not GitHub's
          # synthetic merge SHA. For push/manual jobs use the event SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit under test
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git -c safe.directory="$PWD" rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::Wrong checkout: expected $expected, got $actual"
            exit 1
          }
      - *repository_integrity
      - name: Restore pinned device source and generate isolated Sense overlay
        working-directory: code
        shell: bash
        run: |
          mkdir -p upstream
          mkdir upstream/xiaozhi-esp32
          git init upstream/xiaozhi-esp32
          git -C upstream/xiaozhi-esp32 remote add origin https://github.com/78/xiaozhi-esp32.git
          git -C upstream/xiaozhi-esp32 fetch --depth=1 origin c435f99a88066029ec2dbd2d758c8cc9d051565b
          git -C upstream/xiaozhi-esp32 checkout --detach FETCH_HEAD
          test "$(git -C upstream/xiaozhi-esp32 rev-parse HEAD)" = "c435f99a88066029ec2dbd2d758c8cc9d051565b"
          python3 firmware/head/install_overlay.py --board sense --upstream upstream/xiaozhi-esp32 --output firmware/head/build/xiaozhi-sense
          cp firmware/head/dependencies.lock firmware/head/build/xiaozhi-sense/dependencies.lock
      - name: Compile real Sense board image with local AEC
        working-directory: code/firmware/head/build/xiaozhi-sense
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py desk-robot/desk-robot-sense-s3 --name desk-robot-sense-s3 --language en-US --wake-word disabled
      - name: Ensure real head firmware and asset fit
        working-directory: code/firmware/head/build/xiaozhi-sense
        shell: bash
        run: |
          test -f build/desk-robot-sense-s3.bin || test -f build/merged-binary.bin
          python3 ../../verify_sense_ci_assets.py .
          test -f build/partition_table/partition-table.bin

      - name: Verify default Sense audio privacy
        working-directory: code/firmware/head/build/xiaozhi-sense
        shell: bash
        run: |
          # Check the generated standard image before the private bench rebuild.
          test -s sdkconfig
          test -s build/config/sdkconfig.h
          # AEC PCM capture depends on DESK_ROBOT_CONTINUOUS_AUDIO_ENABLED, so Kconfig
          # omits it when continuous audio is off; continuous audio depends only on
          # upstream flags enabled in sense/config.json and must stay explicitly unset.
          grep -Fxq "# CONFIG_DESK_ROBOT_CONTINUOUS_AUDIO_ENABLED is not set" sdkconfig
          for flag in CONFIG_DESK_ROBOT_AEC_PCM_CAPTURE_ENABLED CONFIG_DESK_ROBOT_CONTINUOUS_AUDIO_ENABLED; do
            if grep -q "^${flag}=" sdkconfig; then
              echo "::error::Unexpected assignment for $flag in default sdkconfig"
              exit 1
            fi
            # Firmware uses #ifdef: even a definition of 0 enables the feature.
            awk -v flag="$flag" '$1 == "#define" && $2 == flag { bad = 1 } END { exit bad }' build/config/sdkconfig.h
          done

      - name: Prepare private opt-in Sense PCM compiler coverage
        working-directory: code
        shell: bash
        run: |
          cat > /tmp/desk-sense-bench-fleet.toml <<'FLEET'
          [[robots]]
          id = "robot-01"
          token_env = "DESK_SENSE_CI_ONLY_TOKEN"
          FLEET
          # A CI-only synthetic credential. Neither a release image nor a
          # flashed robot. Normal firmware above remains default capture OFF.
          DESK_SENSE_CI_ONLY_TOKEN=CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC             python3 firmware/head/private_config.py               --board sense --robot robot-01               --config /tmp/desk-sense-bench-fleet.toml               --secrets /tmp/desk-sense-ci-no-secrets               --server-ip 192.168.1.200               --continuous-audio --aec-delay-ms 0 --bench-aec-capture
          test "$(stat -c %a firmware/head/build/xiaozhi-sense/main/boards/desk-robot/desk-robot-sense-s3/config.private.json)" = "600"
      - name: Compile disabled-by-default authenticated PCM bench variant
        working-directory: code/firmware/head/build/xiaozhi-sense
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py desk-robot/desk-robot-sense-s3             --name desk-robot-sense-s3 --config config.private.json             --language en-US --wake-word disabled
          # The second build must truly compile the private guarded paths:
          # a passing default build with capture OFF is insufficient.
          grep -qx 'CONFIG_DESK_ROBOT_AEC_PCM_CAPTURE_ENABLED=y' sdkconfig
          grep -qx 'CONFIG_DESK_ROBOT_AEC_DELAY_MS=0' sdkconfig
          grep -qx 'CONFIG_DESK_ROBOT_CONTINUOUS_AUDIO_ENABLED=y' sdkconfig
          test -f build/desk-robot-sense-s3.bin || test -f build/merged-binary.bin
          python3 ../../verify_sense_ci_assets.py .

